41、V01·P000581—P000609、V01·P000670—P000683、V01·P000760、V01·P000884—P000919、V01·P000971—P001112","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0002","type":"EVENT","name":"蓝伞菇换武器并订立月底换货约定","aliases":["V01"],"summary":"寻发电机失败却带回约2公斤蓝伞菇，回收站估值40点。 楚光离站觅买家，遇巨石城商队并跟出两街，议价以菌菇换9mm枪、60弹、25点；又约月底交20公斤菌菇抵2000点，订10kW发电机和KV-1外骨骼。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P001728—P001740、V01·P001812—P001941","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0003","type":"EVENT","name":"贝特街征物压力与搬迁提前","aliases":["V01"],"summary":"交易后夜宿贝特街，遇月底征物、屋材侵占未遂及结亲提议；征物使其决定月底前搬走。 翌晨用所得25点买青麦烟叶，携10升水和武装负重返回，见居民自发制水泥，批准继续。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P001942—P002083、V01·P002234—P002339","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0004","type":"EVENT","name":"东侧侦察发现变种人，改道获得工地资源","aliases":["V01"],"summary":"为给即将来的技术居民备肉，管理者携夜十出猎，先绕巢后东行76号街，见已爆绊索装置（爆炸五小时内为气味推断），登楼见变种人木寨哨兵，因只有一枪而撤；改北路发现原料工地，猎两鬣狗返站后禁走东门与76号街。 东营尚未交战、威胁未解除。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P002617—P002828","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0005","type":"EVENT","name":"建材、捕捞和保存改进推动扩招","aliases":["V01"],"summary":"四居民自建炭窑和草木灰水泥，老白获建筑队长职责，扩大窑炉后借工地石料试制硅酸盐水泥；新来的木工和厨师改进砖模、鱼笼和熏肉，首批20公斤水泥及第一尾鱼成功。 但生产运料筑墙至少需约16人，9月9日决定增招24人，三天后接纳，原粮仅够含管理者7人一周，因此加强狩猎；三日打十余鬣狗并捕兔松鼠备粮。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P002566—P002627、V01·P002941—P003269、V01·P003280—P003320、V01·P003470—P003536","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0006","type":"EVENT","name":"北探遭遇掠夺者并取得武装","aliases":["V01"],"summary":"管理者带夜十与蜥蜴人沿出城高架北行，在服装店搜得针线后见两掠夺者追杀拾荒者。 驯犬发现三人，引来射击；管理者由拟撤退转为还击，枪杀犬，夜十掷燃烧瓶封退路，蜥蜴人用标枪杀敌。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P003905—P004016、V01·P004050—P004077、V01·P004442、V01·P004466","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0007","type":"EVENT","name":"采集者遇袭与活性物质补给应对","aliases":["V01"],"summary":"新采集者鸦鸦获分派采浆果菌菇，因毒素直觉可见绿光而扩大范围，走到停车场管口探头，自述被肉状物覆脸、无法呼吸、肌肉不能动后失意识。 管理者定位末位在水蛭巢穴、判为死亡并放弃取尸，施袭生物未被直接看清；为解决重制原料，在无电提取器不能用的情况下决定调借余舱活性物质。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P003738—P003742、V01·P004137—P004164、V01·P004229—P004244、V01·P004454","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0008","type":"EVENT","name":"夜间侦察及卷末对外交易准备","aliases":["V01"],"summary":"因白日北部掠夺者活动，管理者怀疑有据点，准蜥蜴人夜行、命沿高架查半径3公里痕迹、标图即返避战。 翌晨其仍活且不远、未返，侦察结论待后续。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V01·P004420—P004456、V01·P004477—P004508","href":"../01_分卷事实/V01_分卷事实.md"},{"id":"EVENT-0009","type":"EVENT","name":"布朗农庄换粮与返程遭遇","aliases":["V02"],"summary":"为改善前哨储粮及工具，楚光带夜十、方长由公园南门赴东南农庄，以70kg风干肉鱼换350kg粮食，以10张皮换30工具。 返程遇爬行者，战斗后粮食保住、楚光受伤；在餐馆发现被遗弃的断腿佣兵夏盐。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P000015—P000137、V02·P000155—P000319、V02·P000351—P000518、V02·P000627—P000666、V02·P000875—P001028","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0010","type":"EVENT","name":"工坊发展、行商交易与市场形成","aliases":["V02"],"summary":"采集者发现湖边鸟粪石、硝土与河岸石膏；木工、冶炼、制衣、狩猎扩大。 孙世奇跟随居民到来，误会对峙后达成交易，楚光收两袋同式硬币并以60kg肉鱼换5枪200弹；借此引入银铜实物货币。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P001105—P001347、V02·P001599—P001701、V02·P001863—P002040、V02·P002310—P002395、V02·P002795—P002827、V02·P003647—P003658","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0011","type":"EVENT","name":"北方侦察受伤、误擒猎户与余家往来","aliases":["V02"],"summary":"蜥蜴形侦察者在北方轮胎厂附近遭枪击犬咬后返回，报告掠夺者，人数50—100是估计。 另一次猎鹿中，四名居民与少年争执猎物；少年放箭未中，被弹弓打晕带回。 纸笔编号通行证与卢卡接待岗位减少了语言阻碍。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P002057—P002109、V02·P002552—P002793、V02·P003418—P003643、V02·P004215—P004227、V02·P005060—P005124","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0012","type":"EVENT","name":"孙世奇复访、铁背蚁试验与蓝伞菇采集","aliases":["V02"],"summary":"孙世奇先在农庄售货、返红河镇，发现肉粮畅销，赶在雪封路前雇枪手带双头牛复访。 130kg熏肉加10kg熏鱼换10kg粗盐、10把转轮枪、两袋子弹和500kg硬币；因路线耗时与入冬风险，商人接受压价但仍有利可图，并赠一罐铁背蚁。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P003082—P003383","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0013","type":"EVENT","name":"夜勤建立与血手氏族发现前哨","aliases":["V02"],"summary":"随着外出扩大、入冬提前，楚光忧夜间空防，设八名警卫两人一组守四面墙，分配枪弓与投掷物，规定身份识别和开火条件；同时解除夜间明火禁令，推动窑炉昼夜生产。 血手押贡者从贝特取得克隆女性，沿湖避夜间异种，循人迹探到前哨。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P003673—P003703、V02·P003774—P003791、V02·P003864—P003991","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0014","type":"EVENT","name":"李斯特交货与动力设备运转","aliases":["V02"],"summary":"余虎照楚光约定引李斯特商队从贝特到前哨南门，以20kg蓝伞菇兑现第一卷订下的10kW木柴发电机与KV-1外骨骼；再以12张鹿皮换7mm和9mm栓动铁管枪各两把、120弹及2kg粗盐。 商人临走说出城高架北血手六七十人，是其所闻。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P003993—P004022、V02·P004075—P004229、V02·P004557—P004576","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0015","type":"EVENT","name":"血手袭击失败、处俘与守御方针","aliases":["V02"],"summary":"运石者在公园北约1.7km发现十名持枪者带三犬，绕路返报，楚光召回居民并为夏盐留电梯退路。 獾率袭击队用枪声威慑、燃烧瓶烧空掩体，欲炸北门；守方34人从东西门分出两翼、楚光带四人绕侧后，以哨而非无线电协同。 轮胎厂主力仍存，不等同本卷已清剿全氏族。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P004242—P004553、V02·P004575—P004639、V02·P004763—P004792","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0016","type":"EVENT","name":"肥料换粮与卢卡进入前哨仓库","aliases":["V02"],"summary":"第二场雪后楚光率六人用人拉篷车赴农庄，300kg鸟粪石按1:12换3600kg青麦羊角薯，100kg熏肉换500kg青麦及5工具，25kg熏鱼换150kg含铜锌废金属；农庄提出明春3t鸟粪石需求。 以肥量推断农庄种植面积、无土技术和能源作物仍属楚光推想。 卷末木工提出暴风雪0.1火箭箱设想，尚无火箭弹、未试射；三床订单也未交付。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V02·P004797—P005047、V02·P005060—P005124、V02·P005139—P005185","href":"../01_分卷事实/V02_分卷事实.md"},{"id":"EVENT-0017","type":"EVENT","name":"壕沟加固、工地试探与第二次夜袭","aliases":["V03"],"summary":"血手首次袭击后，楚光采刀下留人建议修墙外碉堡与Z形战壕，40名新居民抵达即投入施工、人口到90，当日挖成壕沟（碉堡完成程度未明）。 猎队协观察点搜斥候，四人在三楼烂尾楼以运石者作诱饵，挫败猹派的六名奴隶炮灰：三死三俘，俘虏额面刻猹、无正式骨饰，仍被当持械帮凶绞死。 战获拍卖扣税后并入集体分配，开始以私购武装补公发的后勤负担。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P000009—P000057、V03·P000211—P000241、V03·P000336—P000589、V03·P000627—P000852","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0018","type":"EVENT","name":"海恩由调停者转为诱敌合作者，血手氏族覆灭","aliases":["V03"],"summary":"赴西北砖厂勘地的四人误把灰衣持枪来者当斥候，箭伤后押回。 此人为红河马蹄铁商行海恩，代血手按完整20筹码/人、残者半价赎俘求停战，私利是便宜接收伤员。 主力与据点均失，血手作为北郊团体覆灭，非把第二卷十人败绩直接称灭族。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P001873—P002603","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0019","type":"EVENT","name":"战俘交割、救出囚者与撤出轮胎厂","aliases":["V03"],"summary":"公园29掠夺俘加厂内两少年兵打包31人，折每人20kg粗盐，海恩派温返红河取货、同伦娜在前哨留宿。 旧地牢约30受害囚者放出，与战俘分开；地牢腥臭、虫鼠及残伤现场显示其虐囚生活。 获救者后来30人中五人伤病死、25存，两农奴转仓管、余23迁河窑烧砖，细见人群制度。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P002618—P002827、V03·P003755—P003910、V03·P004141—P004278","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0020","type":"EVENT","name":"砖厂、钢铁厂和温室农场的成立","aliases":["V03"],"summary":"因冬猎减少、房屋需要建材，四人申请砖作坊，楚光给5000银预算、保80%股，改批西北1km河边15亩粘土林地。 此处先作诱敌战场，之后由23获救者扎营，两个工作VM工头沟通，砖窑开始营业，最低伙食、保暖与施工责任受约束。 藤藤接魔鬼丝纺纱织布研发，地精与钢铁合作做木气化锅炉、蒸汽动力，卷末缺件尚未交机；另107mm臼炮已从铸管进展为湖岸两次实射、落点相差约百米。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P000992—P001122、V03·P001465—P001708、V03·P001847—P001918、V03·P004189—P004306、V03·P004462—P004490、V03·P004818—P004883、V03·P005414—P005442、V03·P005754—P005787、V03·P006471—P006505、V03·P006804—P006805","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0021","type":"EVENT","name":"B2开放与两份日记连接的战后旧事","aliases":["V03"],"summary":"血手房日记回述记者李修战时休眠、醒后被轮胎厂社区接纳，与护士孙莱从收音机联上其避难所警卫丈夫。 警卫远程供知识、补给点和救援，却不能开避难门；资源由富转缺导致械斗，孙莱孩子死、其雪夜失踪，李修至废土纪元4年仍求避难所，个人结局未载。 后百名新居民到来含白熊形居民，总人数到200；250为下一批规划，卷末尚未实见抵达。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P002816—P002827、V03·P002933—P003048、V03·P003204—P003742、V03·P003954—P004120、V03·P006142—P006183","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0022","type":"EVENT","name":"裂爪蟹袭击与魔鬼蛾温室的反复清理","aliases":["V03"],"summary":"雪大时裂爪蟹上岸吃掉钓者头部，肩扛火箭偏落蟹后仅伤腿、轻枪无效，楚光B锤击碎半脸杀，尸与蟹车载回。 湖岸被划危险，两方向派侦察，巢和迁来方向未明。 后来近50人挤入抢茧，前头承伤后方获利，引出新的资源勘探许可与补偿规则，卷末探索权未拍出。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P001123—P001395、V03·P004605—P004799、V03·P005085—P005145、V03·P006729—P006814","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0023","type":"EVENT","name":"流民安置、市场货币扩展与银行","aliases":["V03"],"summary":"北来约60—80人、5枪与牛驼牲畜求湖水，楚光率近50武装居民警戒。 吴铁斧接受交枪、留弓弩、定点营地等条件，东门外百米篮球场地扎营；从相互戒备转手势易物，盐足后改要粮、奶留婴，交易供需即时变动。 没有贷款利息或永久银行楼已建的证据。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P004886—P005084、V03·P005137—P005217、V03·P005531—P005653、V03·P005729—P005752、V03·P005788—P006347","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0024","type":"EVENT","name":"贝特私贸、亲邻信任与镇长的借刀打算","aliases":["V03"],"summary":"余家因前哨两成足秤屠宰及好盐多次交易，李牛入伙、小鱼留职；余虎翌日来见妹妹办业务而放心，碰到赵鼠才知其获救任砖工，带盐与平安消息回贝特。 老查理发现私贸迹象，雇王彪跟踪，后者报公园围墙壕沟烟囱蓝衣流民并欲罚逐余虎占棚，获4筹码。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P005789—P006071、V03·P006300—P006470","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0025","type":"EVENT","name":"百货大楼地下庇护所开启与材料回收","aliases":["V03"],"summary":"四人带伊蕾娜反复清百货地下异种，VM显示辐射超阈，爬行者被陷阱困住后由破晓满蓄箭穿头；两爬行者百啃食者为夜十战后自述。 伊独行，取门外骨架防化衣、滤气已坏，炸不动合金门却炸碎侧墙，伸撬棍挑栓开门。 至卷末尚未公布具体结算数；工作台与橡胶已供蒸汽机造件条件改善，纺机仍承诺三日内而未交。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V03·P005448—P005457、V03·P005675—P005724、V03·P006507—P006728、V03·P006804—P006814","href":"../01_分卷事实/V03_分卷事实.md"},{"id":"EVENT-0026","type":"EVENT","name":"贝特街旧镇权终结与新镇政落地","aliases":["V04"],"summary":"王彪持旧镇长给血手的信到轮胎厂，发现已烧空后折返；查理仍付5筹码让其保密，未向镇长说明血手覆灭，另给前哨传自己的信。 楚光取到旧镇长煽动血手攻击前哨的信，查理提出合作，楚光将贡掠与信件解释为密谋并出兵。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P000003—P000098、V04·P000328—P000995、V04·P000996—P001448","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0027","type":"EVENT","name":"百货庇护物资回收与温室转向农业","aliases":["V04"],"summary":"牛马等完成此前百货庇护的物资清点，运出金属、纤维橡胶油剂和新工具台，1500银大宗款按约分配。 温室第一层探索权以200银竞得，9人队定收益分配合同，取茧激增导致仓价跌。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P000100—P000327、V04·P001913—P002023、V04·P007834—P007859、V04·P008145—P008163","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0028","type":"EVENT","name":"76号街冲突、企业协助与地下克隆设施","aliases":["V04"],"summary":"前哨第一支10人探队误触隐雷并遭变种人火力、箭及近战，撤退；第二支再遇伏击，温室队支援仍陷危局。 楚光带更多居民来救，合计101人参战，击杀11变种人，己方15死6重伤，其中4后来终止救治；未一战清掉全寨。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P001450—P001912、V04·P001922—P002023、V04·P002137—P002524、V04·P002525—P002822、V04·P003630—P003635","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0029","type":"EVENT","name":"企业驻点、回收劳务与餐饮丝品贸易","aliases":["V04"],"summary":"李德等到前哨签合同：200人、每日10小时、1CR/小时，另将食宿改每人3CR/日餐补，内部银币发薪自行安排，未接受楚光提出的双方通兑。 罗骅与艾思留下建办事处，泡沫营房30分钟内完成；卢扬护200劳工走10公里到堡垒旁，卢卡携助手驻场与维特对接，负责车库拆车、切割压块、人推800米至重卡。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P002974—P003117、V04·P003140—P003659、V04·P003888—P004510、V04·P004681—P004763、V04·P006629—P006698、V04·P007221—P007281","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0030","type":"EVENT","name":"燃料搜索挫折、伤亡与工业机床交付","aliases":["V04"],"summary":"楚光雇赵羊5银引路，与卢扬队进五环银行写字楼；企业扫楼至20—30层，未找到捕集器，仅取8%备用电池赠楚光。 金库已空只余旧钞；玛卡巴子开文件柜触发殉爆者死亡。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P004023—P004354、V04·P006142—P006154、V04·P006588—P006627、V04·P006770—P006893","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0031","type":"EVENT","name":"军团袭营与榆木区联合反击","aliases":["V04"],"summary":"瓦努斯奉克拉斯命率约2000项圈克隆兵及军官来夺堡垒，用其处理核料制弹破圣盾。 其依森林废墟筑工事、隔热遮侦查并拒联络，先以两榴炮射20弹；堡垒受2弹皆拦、4偏，14奔劳工营地拦12漏2。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P004775—P005104、V04·P005188—P005270、V04·P005329—P005535、V04·P005696—P005828、V04·P006142—P006154","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0032","type":"EVENT","name":"伙伴申请、巨石城赎俘失败与长久农庄留下","aliases":["V04"],"summary":"李德、卢扬、易海及数十乘员签名向银翼董事会推荐404为永久战略合作伙伴，楚光接受，预计3日答复；本卷未单列董事会回文，E类物资实际获准采购另有实证。 巨石城先通过远端情报作中立善后盘算，后派黎华等乘无旋翼机来赎瓦努斯；企业近防警告后让其落地，征求楚光意见。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P005815—P005919、V04·P006066—P006218、V04·P007190—P007315、V04·P007428—P007504、V04·P007862—P007946","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0033","type":"EVENT","name":"捕集器遗物、义肢与轻工业技术取得","aliases":["V04"],"summary":"楚光与4居民由罗骅陪同再访已清捕集器，辨出数百箱石墨、X-4纤维及约50吨迪拉特橡胶；罗骅告知用途与风险，前哨组织搬运，未列逐箱到账。 楚光送红酒饯罗骅，罗骅在堡垒口述信推荐工程师巴奇来404，工程师尚未到。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P006221—P006336、V04·P006390—P006479、V04·P007050—P007203、V04·P007245—P007281、V04·P007745—P007820、V04·P009070—P009129","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0034","type":"EVENT","name":"前哨武器量产起步","aliases":["V04"],"summary":"夏盐先以修复工具台制冲壳、组弹并雇2游牧女工；15支加长装药仲裁者I交警卫，百米准度仍有限。 机床到后，81钢厂拿4000银订单及2000预付、投入原4000存款，订机床零件造冲床和热穿孔机，工坊另供木托握把镜片。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P001666—P001728、V04·P004550—P004597、V04·P006894—P007044、V04·P007655—P007674、V04·P008300—P008400","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0035","type":"EVENT","name":"北线惨败、移民救济与就业建厂","aliases":["V04"],"summary":"长久北门点烟引来九黎（原名离）率187流民，混多据点人、一半途中加入；他称军团溃兵沿途劫掠。 卷后北线直接叙述确认冬攻失败：克拉斯借暴雪削圣盾仍失数十万，西撤车队被动力甲截，克拉斯被抓后遭拟送死爪巢，尚未实写死亡。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P007678—P007693、V04·P007934—P008121、V04·P008189—P008259、V04·P008403—P008505、V04·P008945—P009058","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0036","type":"EVENT","name":"殷方避难、学院追捕与诊所设置","aliases":["V04"],"summary":"殷方为冻伤老人用仿生右臂刀丝清创缝包，一小时手术后病人清醒好转；楚光见其技术先不强问。 北面追踪的尤金等5佣兵本想交涉，但一人因狗警报先向潜伏居民开火，30余居民包围十分钟，4人与狗被杀，尤金被俘。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P008403—P008603、V04·P008507—P008539、V04·P008611—P008760、V04·P008762—P008943","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0037","type":"EVENT","name":"北镇学校的休眠舱与学院黑盒","aliases":["V04"],"summary":"泉水先与感知同伴侦察北镇学校旧小军营，未得可用物。 再次带战地气氛组、我最黑进教学楼，先自动枪后省弹用近战；爬行者从破天花突袭，泉水钢甲挡撞、撬棍抵口，左臂射钉器近距穿颅，未重伤。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V04·P008170—P008176、V04·P009058—P009186","href":"../01_分卷事实/V04_分卷事实.md"},{"id":"EVENT-0038","type":"EVENT","name":"学院创始记录、原理的北行与117线索","aliases":["V05"],"summary":"楚光、殷方和四名持LD47的警卫重返新屋社区大学。 殷方开启黑盒外层，内含年轻的原理博士全息记录；他认出学院三位创始者原理、方法、结论之一，但这与他所知“创始者未到清泉”的历史不符。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P000001—P000159、V05·P000327—P000637","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0039","type":"EVENT","name":"伪装军团的袭击与北方乱局的初次口供","aliases":["V05"],"summary":"屠率伪装蓝外套的掠夺者伏击车队，车头扎入雪中护住引擎，居民分侧反击，楚光用钢钉弹打穿敌人与掩体；援军约十分钟抵达。 己方无死三轻伤，敌报十一死、二十六俘。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P000160—P000303","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0040","type":"EVENT","name":"布朗送粮、轮胎厂回收与聚落间的现实交换","aliases":["V05"],"summary":"轮胎厂清理收复，郭牛、郭马等承担仓储工作。 布朗主动送五吨土豆、五吨白菜，实际诉求是停止附近枪炮惊扰；接待按每人三银预算、实际约七成安排食物，奴隶与护卫分桌。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P000656—P000891","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0041","type":"EVENT","name":"黑蛇佣兵团袭击、反击和117号避难所开启","aliases":["V05"],"summary":"普里特率黑蛇佣兵团经白鲨中介受雇，索取117黑箱及动力甲，真实雇主未明。 敌人先在地铁入口杀十五人，以狙击和交叉火力封锁。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P000892—P001541、V05·P001542—P001885、V05·P002248—P002930","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0042","type":"EVENT","name":"117幸存者、火炬内乱与新研究成员","aliases":["V05"],"summary":"鸦鸦察觉水培区毒素痕迹，发现暗门后的二十台休眠舱，多数人已死，只唤醒赫娅。 她自称生物工程博士，废土190年入睡、211年醒来，七成九器官为仿生替代。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P002248—P002930","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0043","type":"EVENT","name":"404第三层、黑箱产物和地下交通","aliases":["V05"],"summary":"B3开启后，新增六百房间、四区及种植、仓储、医学等设施。 两只黑箱分别可生产VM与专用休眠舱，已实际投入生产；生产要原料、能源及外接适配，非无限物资。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P002248—P003594、V05·P003595—P004278、V05·P005627—P006294、V05·P007204—P007257、V05·P007905—P007940","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0044","type":"EVENT","name":"生态实验基地失利、俘虏老白与断剑突袭","aliases":["V05"],"summary":"牛马组探索东北约十六公里的中洲航天三号生态实验基地，进入B1雨林生态园，遇四米级死亡之爪与另一队掠夺者。 老白为掩护队友，利用破灯短暂干扰猛兽，又与敌人交火，负伤昏迷被俘；掠夺者给他治疗并拘束。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P003595—P005626","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0045","type":"EVENT","name":"火炬使徒、神迹装置与生物研究","aliases":["V05"],"summary":"灰袍俘虏自称火炬教会使徒、称组织中立，以名为神迹的头戴装置和死亡之爪颈后项圈控制猛兽。 楚光等将猛兽拘在哨所西侧，殷方亲试可使站卧单脚跳，不能令它画圈犬吠，持续使用使人眩晕；殷方认为是强精神暗示而非完全接管。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P004961—P005626、V05·P006464—P006598、V05·P009087—P009146","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0046","type":"EVENT","name":"嚼骨威胁、迁居协商和冬柳救援","aliases":["V05"],"summary":"楚光请周边首领迁到长久以缩短防线，承诺自愿、财产受保护、废奴、土地及开荒安排；布朗起初反对，其余部分同意。 牛马返途中救冬柳，被羽、铁膝两路袭击的村民死伤严重；以狙击、火箭和东西夹击压退敌，增援到后掠夺者两卡车一皮卡撤，未追。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P005627—P006294","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0047","type":"EVENT","name":"电池厂保卫、二十人牺牲与首批迁出","aliases":["V05"],"summary":"边缘划水率二十人、吕北和两卡车到二十二公里外超威电池厂接李中居民，河狸带五十人两装甲皮卡突袭。 铁拳毁第一车引擎，玛卡巴子以十二联刺拳毁机枪，第二车又压制，后侧绕攻逼守军退厂房；十位当地人同守第二线，其他人入仓库。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P006326—P007052","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0048","type":"EVENT","name":"暴雪毁营、百货安置与六十日配给","aliases":["V05"],"summary":"暴雪能见度骤降，长久东门流民棚几乎全毁，初报七死二十一伤二失踪；新到冬柳村民在马占丘带领下帮助搜救。 工业区砖屋、长久泡沫房相对完好，但没有空屋容纳新增人口。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P007262—P007608、V05·P009719—P009888","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0049","type":"EVENT","name":"新币、工业动员与装备交通的发展","aliases":["V05"],"summary":"代币现金不足促自铸新银币及纸钞，鼹鼠图案采纳，吴木试防伪纸，新银币已实际用于收购。 军需扩张伴工厂迁入轮胎厂、钢厂工人增至九十、化工和弹药集中生产；夜校使识字与转正式工挂钩。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P003595—P004278、V05·P006863—P006968、V05·P007119—P007257、V05·P007905—P009061、V05·P010820—P010822、V05·P011235—P011414","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0050","type":"EVENT","name":"新年食物赛、聚落共庆与食谱扩充","aliases":["V05"],"summary":"楚光依小柒建议用创意食物赛庆年末、探索替代食材，活动定211年12月25日至212年1月1日。 鸦鸦负责毒素辨识和试吃。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P008904—P009082、V05·P009313—P010094、V05·P010899—P010974","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0051","type":"EVENT","name":"年夜袭农庄、反击与阵亡警卫的后事","aliases":["V05"],"summary":"狮牙以灰狼一百五十余人作先锋，灰狼潜伏长久以北十公里旧镇，斥候按炊烟误算防守人数。 吉祥夜哨发现敌袭吹哨开枪，三十七警卫抗强火力，塔楼机枪被炸，北门遭爆破；扳手率余部退在建公寓，尾巴斯斯临场牵制，南部休眠舱内九十余居民起身参战。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P009891—P010836、V05·P010998—P011120","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0052","type":"EVENT","name":"两支千人队的争抢与春雷行动开端","aliases":["V05"],"summary":"俘虏供述及分别审问，使楚光确认狮牙与黑蛇非同队。 狮牙驻远溪约一千五百人，牙氏根基西洲；黑蛇在TS南郊千余，车辆较多，本应东掠红河却抢北郊。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V05·P008367—P008548、V05·P010481—P010594、V05·P011122—P011414","href":"../01_分卷事实/V05_分卷事实.md"},{"id":"EVENT-0053","type":"EVENT","name":"春雷伏击摧毁黑蛇部队，北线战利品与人口归入长久农庄","aliases":["V06"],"summary":"维德斯率黑蛇车队沿省际高架南下再西折，意图截断长久农庄，避开生态基地高地。 工地少年与砖先以骑枪打断坦克履带，第二发击炮塔跳弹；负债大眼用旧爬行机器人携爆破物钻车底，坦克爆炸。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P000003—P001465","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0054","type":"EVENT","name":"俘虏劳动、军团关系与北线退却","aliases":["V06"],"summary":"新战俘营在菱湖北岸规划空地建起，由囚犯自己伐木施工，警卫和机枪车辆押送；刑期二百年加五十年、可劳动减刑，尚无具体核减兑现记录。 维德斯与瓦努斯认出同军校关系，前者在东方失利后随上级投嚼骨。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P001109—P002495","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0055","type":"EVENT","name":"春耕、机械化开荒与流民村落落成","aliases":["V06"],"summary":"菱湖北至榆木的百平方公里荒地具开垦潜力，十五万亩只是换算规模，首期三万亩是生产目标。 旧农具约120件、半数铁制，楚光许诺一周三百、月内补余；后两日实际交付五百件铁制部件配木柄。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P001876—P002495、V06·P003207—P003863、V06·P005579—P006234、V06·P007000—P007654","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0056","type":"EVENT","name":"李斯特从贸易伙伴转为本地制造投资者","aliases":["V06"],"summary":"李斯特见北郊击败黑蛇后再访，韩龙等护卫在外等待并观察居民的觉醒迹象；具体人数感知有不确定性。 他参观混凝土道路、前哨建筑和枪械流水生产，对镰刀步枪试射改观。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P002189—P003206、V06·P003864—P004452、V06·P007000—P007654","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0057","type":"EVENT","name":"巨石城远行建立办事处，贸易认识在实地交往中修正","aliases":["V06"],"summary":"第一支队伍随钱莱从废墟绕往巨石城，多次遭掠夺者，夜宿办公楼须清啃食者、布防且避免明火。 十二车道高架可远望夹于高楼间的巨壁，贫民窟规模无人确数；旅馆涨价与门外杀客事件显示城外保护边界。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P003207—P005578、V06·P007335—P007975","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0058","type":"EVENT","name":"红河军火与矿产贸易形成驻外基地，战争仍未结束","aliases":["V06"],"summary":"红河镇受污染、植物稀少、节肢异兽多；当地红票以奴隶、蓝票以矿为基础，协会担保兑付、回收销毁，矿主违约可由其他矿主先兑再追债，这种信用不是绝无伪造或风险。 蛇氏族两千余压境，后来还有其他方向增援，佣兵虽多但组织与后勤差。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P004164—P004821、V06·P005579—P006234、V06·P011131—P011444","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0059","type":"EVENT","name":"驯兽试验、鼠群迁往西洲与前线情报","aliases":["V06"],"summary":"缴得三十七火炬心灵干涉仪，颈环和头部操控装置可供有一定心智的动物，不适于无心智黏菌；需预约赫娅或夏盐操作。 多数新购者几天未驯到死爪或熊，垃圾君吸引母死爪的尝试也未奏效，不能把理论能力写成已拥有兽军。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P001109—P002188、V06·P002832—P003863、V06·P007335—P007654、V06·P008334—P008706、V06·P012532—P012867","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0060","type":"EVENT","name":"绑架蓝衣的伏击被击退，罕见共生者巴奇获接纳","aliases":["V06"],"summary":"乌仇受匿名五千筹码加缴获物委托抓两名蓝衣，先雇普通匪徒失败，再亲带临时聚来的二十人埋伏1101街商场。 藤藤、尾巴、斯斯、芝麻糊、鸦鸦和熊随商队经过，鸦有危险感但未精确定位全部敌。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P006235—P007334","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0061","type":"EVENT","name":"孢子预警、猎人工会与数据中心先期清剿","aliases":["V06"],"summary":"孢子预警显示新母巢临界，赫娅预计两周后浪潮，实际一周即来，说明预报并非准确期限。 赫娅解释菌毯厚化形成孵化室，特定条件下回收子实体扩暗红区并突变母巢仍有未知。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P007335—P009083","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0062","type":"EVENT","name":"65号街阻击全军阵亡，为68号街主防线争得施工时间","aliases":["V06"],"summary":"余虎绘出一主四支北上路线，夜行速度约昼两倍，估两天有至少十万抵北郊，花园街在主路；这是浓雾下的估数。 泉水领120人、半新半老，通讯至排，守65号街与长菱高架交口，后有二十炮手六88迫炮144弹。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P008890—P009775","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0063","type":"EVENT","name":"68号街守住浪潮，样本揭开节点生物与战前装甲经历","aliases":["V06"],"summary":"次晨约两千先行啃食者被六百居民和近二百警卫击退。 腐朽骑士再来，两发88无后坐力破甲弹被链锯劈断；楚用原装高斯长钉穿胸爆头两枪杀死，异种队形顿乱。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P009683—P010449、V06·P010486—P010609","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0064","type":"EVENT","name":"尸体与疫情推动迪迪威食品厂落地，补给体系支撑持久战","aliases":["V06"],"summary":"浪潮日杀两三万、十日未衰，最初十万估计显然不足；日弹耗约十万发、2.5吨。 新增钢芯钢壳弹线以减铜成本，化肥线停工保军用。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P010539—P011087、V06·P012532—P012867","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0065","type":"EVENT","name":"菌坦克与飞虫炮兵加入决战，地面渗透和首次空战破节点","aliases":["V06"],"summary":"反攻前夜暂停出口，前线设轮休设备，主力回调。 无炮塔履带的菌覆坦克由触须托行，高斯长钉和20穿燃弹被弹开，RPG多发也未破；换20高爆炸断软触须使趴窝，蠕虫试修时持续压制。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P011445—P012208","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0066","type":"EVENT","name":"浪潮退却后社会恢复，行商工会和牧场政策推进","aliases":["V06"],"summary":"节点与新母巢毁后北郊战斗结束，孢子约七日回常，三日后已明显消散；巨石城西三至二环仍有地下母巢作战。 赵永旭误以北郊败亡，派机巡看钟楼残骸才确认胜利。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P011090—P011444、V06·P012397—P013181、V06·P013881—P014052","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0067","type":"EVENT","name":"新联盟正式成立，曙光城成为首府并展开制度建设","aliases":["V06"],"summary":"查理指出贝特、前哨、工业区、长久居民多未入避难所，需要共同身份。 楚先拟联合404与117、划复原区、用复兴法案授管理者集中权力，随后在庆典18时实际宣布人类文明复兴统一战线成立，简称新联盟/新盟。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P012868—P014052","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0068","type":"EVENT","name":"B4开启交付战前装备、黑箱和新的本地生产约束","aliases":["V06"],"summary":"庆典前夕楚携小柒实际进入B4，依次有走廊、半圆休息阅览空间、健身与按摩区、授权整备室、圆形设备室。 休息区架空无书，咖啡机无豆只能作饮水用；来源不明的调拨猜测不能作为布局真相。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P013182—P013507、V06·P014633—P014724","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0069","type":"EVENT","name":"布朗主动接受改造，农奴与仆人脱离私人支配","aliases":["V06"],"summary":"布朗因粮油征借、两月亏近万筹、担心被公审及联盟扩张，主动献庄；表面演讲感化之说不代真实动机。 楚保留其守法经营权，要求释奴、最低工资待遇和纳税，给低息机械化转型贷，账目正常的公司破产只清资产不使个人变奴。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P014054—P014253","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0070","type":"EVENT","name":"诱导血清进行有限临床，近卫部队开始组建","aliases":["V06"],"summary":"警卫驻地旁红砖疫期救助点转为常设卫生所，五十余床，识字流民受赫娅短训任临时医护，能力有限。 五十名自愿警卫首针十六觉醒、三十四未醒，后者可自行选择余三次，均愿继续；此前二十避难居民试效很小，赫娅归因DNA表达特殊而非药物对所有人通用。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P014633—P014724","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0071","type":"EVENT","name":"401探索遇铁背猿受阻，再攻在卷末刚刚展开","aliases":["V06"],"summary":"科考团从资料知401五十年前开放，仅锁清泉东区第三生态保护园或邻地铁附近。 牛马五进入藤木覆楼的原始林城，睡蛇睁眼前夜十未察，林冠又使无人机难视；感知侦察非全知。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V06·P014254—P014831","href":"../01_分卷事实/V06_分卷事实.md"},{"id":"EVENT-0072","type":"EVENT","name":"生态园攻坚、解救与401研究来历","aliases":["V07"],"summary":"燃烧与丛林二十名觉醒者攻入生态园，垃圾的钢甲利爪与咆哮先驱散铁背猿；共振场使猿返攻仍被击退。 戒烟以红烟标目标，W1机枪、两枚燃烧弹清场，营地清出跑道，飞机颠簸但安全着陆。 火炬项圈是对共振技术的定点改造，不能与生态园广域场混写。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P000003—P000650","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0073","type":"EVENT","name":"401开启、种子与燃料棒恢复供电","aliases":["V07"],"summary":"401入口藏生态园地下室，工作间伪装已被破坏，连接地铁通道，进入时清掉二十余啃食者。 四层分别为B1/B2居住、B3娱乐、B4种植，理论1600人、拥挤可到2000，居室约20—30平方米，带卫浴冰箱；开放约五十年，约七百人经历疾病与掠夺后仅孙等七人幸存。 变量蓝服可调通气透湿热感，不等于极端环境无敌；复垦种植、住房整理仍需后续。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P000372—P000984、V07·P001615—P002648","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0074","type":"EVENT","name":"火炬伏击、空中支援与技术对抗","aliases":["V07"],"summary":"牛马返程距安全区两公里时夜十察觉杀意，藏燃料分散应敌。 黑色外骨骼专业队投四枚纤维空爆干扰弹，切断VM与无人机无线链路；方长穿甲箭伤拉文左肺、爆裂箭被护甲挡，老白迂回六百米发现重外骨骼迫击炮组。 楚光赫娅乘已驯服的妮蔻赴401，妮蔻为约五米死亡爪，能在外服从指令、以鬣狗喂养。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P001615—P002313","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0075","type":"EVENT","name":"北方流民接纳与北伐动员","aliases":["V07"],"summary":"联盟之声广播吸引西洲397名流民南来，武器交出后获食水与四床流民之家宿舍。 识字懂无线电的斑马改名马班，先管登记，再入救济协管。 燃烧布置争得时间与铁路运送弹药、建材构成同一后勤链。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P002314—P004679","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0076","type":"EVENT","name":"红河贸易、铜资源与农业保障","aliases":["V07"],"summary":"白熊骑士团为登记商队，非正规作战兵团，电骡顶装马克沁II及护板带三具RPG赴红河马蹄镇，夜遇胡狼后出售武器并换铜镍锌硫；铂约次日运交为当时约定。 马蹄镇由矿场商行分围墙管理，八成外来人口，非统一城镇。 楚安排土豆后春玉米、叶菜后旱转水稻，停大规模青麦但饲料救济军需保留；小麦七八月收是未来。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P001311—P001614、V07·P002649—P004332、V07·P007487—P007520、V07·P009300—P009478","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0077","type":"EVENT","name":"青石县空地攻坚与解放","aliases":["V07"],"summary":"狮牙派铜炉绕路侦察见铁路与远溪，误把矿传言作镇中矿真相；金牙给铁牙五百兵、限周取远溪而未全力援。 青石入口丘陵夹旧公路与磁悬浮线，炮楼、混凝土掩体和百货指挥楼为据点。 楚提前布北防和矿业队，实际勘矿不等于即刻满产。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P003632—P005671","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0078","type":"EVENT","name":"松林峪阻援、火力升级与装甲集结","aliases":["V07"],"summary":"燃烧百人、白银二十等赴青石北约9.7公里松林峪。 铁牙五百沿路半日仅走十公里，夜十伤腿标首领，Y1与步兵火力使七成以上损失，垃圾驱散追击，铁牙被俘。 迪隆取代蛮族前线指挥，拟待暴雨削弱目视攻击机；联盟一周造五百反坦克拒马铁路送前线，配坑道、反装甲与炮兵，双方准备汇入后续会战。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P004983—P006664、V07·P007235—P008300","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0079","type":"EVENT","name":"勇士空降、学校改装厂与敌后补给","aliases":["V07"],"summary":"燃烧改执行敌后空降，二十五机载伞兵和装备箱，约三千米高跳；首22人有14存活，含战斗减员而非全系跳伞故障。 尼龙伞本地织造，电台要先架，老白夜十从箱修松脱电池、藏屋顶水箱保持十公里联络；鼠旧台因转驻青石已停。 死亡兵团凌晨突袭北坡二百余工兵守军、夺工具弹药焚尸后撤，埋伏炸药在对方返回时实际爆炸，与空降分属不同协作行动。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P006314—P006987、V07·P007020—P007108","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0080","type":"EVENT","name":"弹簧刀从试验到电视台实战","aliases":["V07"],"summary":"无后坐力串联弹对反复受损征服者10残骸第十二发才侧贯；瓦努斯提醒不证明能可靠打完整坦克，10型夹层装甲与5型轻型用途不同。 弹簧刀为H电池六旋翼折叠自爆无人机、十五公斤载荷，李厂供机电材料、科考电路、小柒控制与地精机体弹头；与Y1控制电路软件通用，触屏或基站神经接入。 敌随后调五千搜城并加筑防空，不等于无人机从此不受干扰。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P006665—P007275","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0081","type":"EVENT","name":"希望镇联络、入盟与救济整编","aliases":["V07"],"summary":"老白留麦饼给七八岁拾荒孩子，方长跟踪回地铁绿门地下商场，解除游击队持枪对峙、结识镇长兼抵抗领袖武成义。 王四杰负责游击队现场，猎弓愿作向导。 吕北接671游击队可战不足半，劣枪复装弹故障致非战斗减员超过战伤，要求六百枪百万弹、暂停袭击训练；后实际换装自动枪火箭筒，夺东城区行动自由，并参与断敌北逃。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P007311—P008300","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0082","type":"EVENT","name":"人工降雨诱出装甲与松林峪会战","aliases":["V07"],"summary":"H1云上喷三百公斤干冰人工催雨，钢瓶意外落敌中未被识；火箭碘化银只是另一备选。 迪隆趁雨出27坦克五梯队、五十防空车五千步兵；约一小时雨停，防线以拒马限制通路、坑道近身爆破打断首七车中五履，百毫米炮迫击机枪压步兵。 猎鹰金鹰枪指市民青年军，与21克隆填线部队原编配不同，来源仍待查。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P008301—P009299","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0083","type":"EVENT","name":"炮击、传单与岩牙转向","aliases":["V07"],"summary":"瓦努斯与楚选择避免直接城市巷战，炮阵实际推松林峪北五公里山坳，九点起打西洲南西区域关键工事，燃烧观察落点修射；四新区湖水淹没地下，难挖防炮洞。 金牙拒北撤、威胁割舌，派部散守城。 两万残敌并未因此在筹划阶段已投降。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P009235—P010107","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0084","type":"EVENT","name":"指挥部渗透、金牙之死与全城收降","aliases":["V07"],"summary":"南城炮击牵狐牙千余精锐，燃烧140觉醒者20筏从西湖沼泽入，叛军加入四十余筏近四百，利用岩牙岗位通行与熄灯近指挥部。 最后200米亲卫生疑，方长射机枪哨、戒烟炸栅，垃圾夺楼、叛军阻援，二百公斤爆破筏破墙、H1红烟坐标支援。 卷后另报十余千夫长除三五主动降外绞刑、金牙尸示曙光北门，审判/执行的先后状态分别保留。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P010047—P010862","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0085","type":"EVENT","name":"战俘、获救人口与黎明城快速安置","aliases":["V07"],"summary":"广场蜂鸟/小柒计21573俘，岩牙报21708仅粗计。 青石营按8000—10000预建，容不下，分批送矿、余就地自建营；岩牙、猿牙等先降者做监工、正规军管监工而非俘全自由。 电工具电骡依电，木车补充不能替稳定电网，楚求五台百千瓦以上柴发机尚未在此到货。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P010547—P011311、V07·P012054—P012221","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0086","type":"EVENT","name":"氦三回收、地下聚变堆与101联络","aliases":["V07"],"summary":"王中原101地表营厨师，以反应堆情报求妻药粮，妻后来已获治。 其供称101已修地下交通网备用聚变堆一半，输出原文GM级，先列线索未实见；殷指出常规堆与永备避难所堆在耐久、启停、燃料规格不同，不能简单插棒启动。 双方仍不肯开101门正式接触，楚改邀考察，尚未换取反应堆修复承诺。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P007885—P008004、V07·P010770—P011084、V07·P011301—P011558","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0087","type":"EVENT","name":"101代表团来访、互赠与排水设计调整","aliases":["V07"],"summary":"霍恩为营地镇长任事务官，营地已通过地表摄像及短距无人机观战争；VR连管理者，决定学生帕伊、两工程师等六人访问，保镖天琴从101门出来。 艾文为档案员兼教授技术顾问，独整遗留资料年老力疲；帕伊16岁植稀贵仿生芯片增记忆计算，黑箱不能生产，机械微电子天体物理知识可达学院D级，欠经验耐心。 西洲湖为人联大陆环境改造产物，堤坝导水北汇天水开发东北黑土是长远意向，不等于堤坝已动工。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P011480—P012444、V07·P012508—P012754、V07·P013286—P013320","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0088","type":"EVENT","name":"军火商来使、红河重组与巨石关系恶化","aliases":["V07"],"summary":"巴格罗供前年14装甲万人队溃后布格拉当修理，原万夫长康德拉介绍五万第纳尔训练工作，火石把他与坦克打包售嚼骨；军团与军火商有何深层扶植仍待查。 火石首领西格玛派泽维尔祝贺、出五十万第纳尔赎迪隆，因死失败；又求零关税勘探开采权协定，楚拒，仅愿非军火关税优惠未签。 卷末书宇报厅长拟通话，尚未谈具体条件。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P009661—P009740、V07·P010627—P010769、V07·P012445—P013074、V07·P013384—P014073","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0089","type":"EVENT","name":"清泉中心采样与机器黏菌拟态遭遇","aliases":["V07"],"summary":"赫娅因黏菌样本不足一个月停研，楚解除二至三环采样限制；她类比楚DNA随子实体环境演化修饰为观察解释，不凭此补全机制。 牛马五人轻装由H1五环边空投南三环，六伞含补给，兼寻坠楼W1与落羽VM。 与此同时帕伊看地精新机草图后寻生物质原油，仍准备阶段，不能写新发动机造出。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V07·P013320—P013380、V07·P013737—P014073","href":"../01_分卷事实/V07_分卷事实.md"},{"id":"EVENT-0090","type":"EVENT","name":"中心侦察撤回与巨石城空域交涉","aliases":["V08"],"summary":"楚光仍在404，令卢卡以曙光城临时城主身份与杜隆视讯交涉。 巨石城最初要求清泉市五环内全部空域，卢卡拒绝扩张威胁，提出进入联盟控制区须承担战争代价；双方口头谈成北四环至北五环联盟可飞、不再向南扩张的边界。 VM记录证明坠机时有EMP脉冲，殷方据此推断导航定位受损导致低能见度撞击；EMP由谁造成仍未查明。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P000003—P000509、V08·P000876—P001386","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0091","type":"EVENT","name":"仿生演化、制冷普及与新航空燃料","aliases":["V08"],"summary":"殷方观察暴君由两个子实体构成，内层近似未发育啃食者，外层为自愈角质甲，形态借鉴腐朽骑士利用旧装甲；第二代已能在不再取得旧甲的情况下复制保护形态。 七毫米弹效受限。 军团误以为其来自三千公里外的企业，不能据此认定企业已有该航程飞机。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P000358—P000722、V08·P001438—P001751、V08·P002847—P003128、V08·P012912—P013116","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0092","type":"EVENT","name":"外交车队伏击与军工董事试探","aliases":["V08"],"summary":"老白、方长等燃烧精锐护卢卡赴巨石城。 第一次二十余匪徒伏击被清除，钢盾觉醒者布莱克在药物强化后仍被击败，连同五人被俘。 楚光认为袭击可能试探联盟能力，属于当时推测。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P000876—P001751、V08·P002091—P002799","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0093","type":"EVENT","name":"贸易冲突、工人失业与有组织的抗议","aliases":["V08"],"summary":"联盟以两银币兑一筹码的行政比价、进出口结算管理吸引设备和工程人员；筹码可换银，普通外流需进口银行审批，出口须银币结算。 巨石城营养膏、罐头、纺织与酒类工厂受联盟食品衣物竞争，出现停工和失业。 楚光综合材料认定维佳策动火灾与抗议，拟在协议后公开、排除采购，不能把每一抗议者都写成受雇、也不能补写尚未出现的审判结果。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P000876—P001386、V08·P001752—P002451、V08·P002452—P002799","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0094","type":"EVENT","name":"两亿贷款把巨石工业与联盟建设连在一起","aliases":["V08"],"summary":"卢卡拒绝巨石城借危机收紧贸易，转提借两亿筹码购买建房、食品、纺织、肥皂等物资，让当地工厂和就业从联盟扩建受益。 楚光提出八十年、利率最高百分之二、年息不超五百万且无抵押，是谈判目标，此处不补成最终合同全部条款。 楚光猜重建委渊源在得到资料前仍只是猜测。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P001752—P002090、V08·P002452—P002799、V08·P003422—P004152、V08·P008771—P009103","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0095","type":"EVENT","name":"新报纸从广告渠道变成战争动员工具","aliases":["V08"],"summary":"方长通过夜之女王舞女与多莉打听亚力克。 多莉自述曾参与龙血改造测试，失去左眼左臂，向巨石军工借义体、每月还五十筹码至四十岁，不还可能停机；成功觉醒五成、无效四成、不可逆组织伤一成，是她提供的试验口径。 墨尔文因经济与贷款风险转向支持军购融资，形成可观察政治经济效果。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P002091—P002451、V08·P003422—P004152、V08·P006648—P006979、V08·P008118—P009071","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0096","type":"EVENT","name":"私人诊所贸易、强摘器官与救出受害者","aliases":["V08"],"summary":"方长实际见巨石西工业区格雷西诊所售电子眼、仿生肢、战斗组件及五万筹码仿生人，并购二十七件、五万六千六百七十一筹码、六箱义体；不是买了仿生人，也不是全部装自己身上。 诊所报价与销售宣传如抗死爪效果，不能当成实测。 自愿器官捐献、合理手术费替代强摘市场仍是与第一医院探索的方案，报纸曝光已发生，全面替代市场未发生。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P002847—P003128、V08·P005894—P006979","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0097","type":"EVENT","name":"教育、十二部门与黎明基础建设","aliases":["V08"],"summary":"联盟十二部门框架已成，教育部门征询家庭，拟逐步提高最低劳动年龄与义务教育年限，未给统一新法定年龄；夜校、成人识字算术与全日制优等资助并行。 帕伊发现小鱼数学学习突出，楚光坚持她与家人自愿，同意后安排留学。 殷方组装金牙一百零三点九公斤氦三燃料棒，101团队已找到战前地下应急堆，但旧件待换、年内电网发电只是目标，本卷未点火。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P000510—P000722、V08·P001438—P001751、V08·P002847—P003128、V08·P003867—P005893","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0098","type":"EVENT","name":"企业来队的补给、感染者与工业合作","aliases":["V08"],"summary":"企业第26突击队到曙光，约一百二三十兵、二十动力甲，其余先锋外骨骼及G9，另三十五至五十后勤、十辆半履带与驮兽。 企业有军用通行许可、机场和营房安置，与联盟警卫联合活动；普通访客携枪则须安全持用，较大武装另登记、额外弹药爆炸物留北贸易站，不能把来队许可扩成无条件所有军队通行。 补给训练三日后援军实际向西出发，十辆车装物资、暂用LD47。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P004249—P005536、V08·P006648—P007036","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0099","type":"EVENT","name":"101虚拟文明会面与战争历史的证词","aliases":["V08"],"summary":"楚光到101齿轮门外，在霍恩安排的帐篷戴VR见方法博士。 博士表示101居民已舍肉身上传，最初六千、现在三十亿模拟人口，部分为自主演化；这是原生世界虚拟文明，不能加进地表常住人口。 不能据会面推定101已与联盟共享全部文明和上传技术。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P005894—P006265","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0100","type":"EVENT","name":"西行贸易、瑞谷前哨与重伤的罗骅","aliases":["V08"],"summary":"白熊一周西行到瑞谷附近卡廷驿站，携方便面、可乐与魔鬼丝衣物，原拟九号绿洲贸易。 当地最大营地数百人、常住约百余，六成帐篷为外旅，主要游牧、狩猎兼耐旱作物。 后来伤者及血卡由后勤队实际送404。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P006648—P007326、V08·P007943—P008264、V08·P009446—P009569、V08·P010721—P010821","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0101","type":"EVENT","name":"海里克袭击、钢铁之心出现与试探空袭","aliases":["V08"],"summary":"海里克率十一军团兵持Pu9伏击斯斯、索要罗骅。 磁力弹弓先杀五人、卡车机枪和白熊反击后海里克被俘；魔鬼丝防弹衣挡九毫米却仍使肋骨内伤，不能写刀枪不入。 帕伊随后解释护盾，联盟承认正面技术差距，并寻求外援与登舰办法；本卷没有靠试探空袭破盾。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P007147—P008180、V08·P008383—P008770","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0102","type":"EVENT","name":"地面搜索、泰迪死亡与空营炮击","aliases":["V08"],"summary":"雷契尔千夫长率航空陆战队下地，三级工事、两台挖机、两辆四联20毫米防空履带车随部署。 维托、瓦利特、修三个觉醒精锐杀商人杰普及护卫，获白熊去向后追营，发信号唤附近巡逻队。 军团仍误认风暴为企业援军，雷契尔未受处分而获地面全权；翌日下地实际千人、按三千规模扩工事、派武装说客索补给劳工并收买佣兵掠夺者。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P007810—P008770","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0103","type":"EVENT","name":"游击、强迁与落叶营地的扩张","aliases":["V08"],"summary":"联盟先遣分侦察、接触居民、袭巡逻组三路，三日十二次以上袭击，单次严格三分钟内撤、缴枪弹就地补给，迫军团缩巡逻、增单队人数。 泉水原想夜间争取被逼居民提供消息，不要求他们公开上阵；巨石阅报动员与瑞谷本地争取是两条相连但不同的工作。 十女奴被安排洗衣、帐篷邻置，不写成已解放或婚姻。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P008642—P009569、V08·P009780—P009859、V08·P010520—P010722、V08·P012498—P012607、V08·P013192—P013402","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0104","type":"EVENT","name":"债权人的军援与未完成的登舰器","aliases":["V08"],"summary":"巨石城外城五十多万人、人均收入约百筹码为本段概数，收入周期未明。 贷款与工厂扩产使墨尔文、杜隆不愿联盟战败，遂以采购成本五折供浪潮剩余军备并另给军购贷款，楚光接受。 瓦努斯所指腹部投弹舱火力较薄是经验弱点，不等于到达腹部即可无损胜利。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P008771—P009179","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0105","type":"EVENT","name":"图书馆下找到79，逆变异说法引起怀疑","aliases":["V08"],"summary":"白熊按旧档到东区香菱街79号市立图书馆，绕六米死亡之爪，见图书馆内两三百户香菱镇。 镇长吴涛称军团前来烧屋强迁时死爪袭击令其撤退，居民靠喂鼠鬣狗暂留它，不是已经驯服。 永氏失联后再现，对来人太多惊慌，拒告位置。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P009570—P010460","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0106","type":"EVENT","name":"罗骅带回零号钥匙，开拓者号仍受围","aliases":["V08"],"summary":"罗骅第一次醒来仅说“找到了”，从腹部取卡托交楚光后再昏迷；当时卡是钥匙、企业想借此拉联盟参战均为听者猜测。 后勤送达后赫娅检出至少二十弹片、左臂坏死，殷方实际截肢装企业义臂，罗骅醒来。 罗骅转联盟第一医院，救援与进一步求援仍在进行。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P008032—P008264、V08·P010721—P011125","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0107","type":"EVENT","name":"轨道漂流瓶联系企业与五巨头利益交换","aliases":["V08"],"summary":"罗骅提出利用仍存T系列科研卫星：找到原定地面站、激光上传消息，再使其坠东海岸让人回收存储数据。 燃烧二十五人空投东侧七十公里旧研究所，无人机侦察、六挺37毫米重骑枪配步兵二十分钟清变种人，救十余成人儿童、告知可赴联盟，未确认他们后来到达。 后得河马2黑箱带来动力希望，仍受燃料限制，不能反推这些武器已经造好。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P010822—P011450","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0108","type":"EVENT","name":"研究日志揭开79方案，两个会说话的死爪","aliases":["V08"],"summary":"斯斯在行政楼取得研究日志，发现逆变异解释与档案相矛盾，永氏随即锁合金门、停通风灭口。 其他队员继续推进、暂不揭穿永氏。 它称许多死爪及异常部落个体源此，不能扩成所有异种、所有部落或所有觉醒都源79；熊、金牙具体血缘只是听者联想，尚无遗传实证。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P010928—P011757","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0109","type":"EVENT","name":"血清真相、诱饵会面与永氏被杀","aliases":["V08"],"summary":"中央库实际取二十六支血清；正文确认实验设备百年来持续按预设流程观测优胜者、取进化因子提纯，促变异走向更强极端适应，而非逆转。 永氏约雾晨在外接收，以被咬断四肢、毁眼尾的幼死爪试药，注后不足一分钟死亡；并非全部个体都能承受进化。 永氏死后斯斯已得其门、通风、摄像等部分权限，计划让镇民暂避清理后的大厦，随后实际完成地下迁入。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P011758—P012208","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0110","type":"EVENT","name":"79权限交接、难民营与遗产继续使用","aliases":["V08"],"summary":"地下管理者解释权限绑定多重生命特征，VM、仿生芯片等仅连接终端；持有人生命信号从采集范围消失且无指定继承者时，由最近终端持有人继承。 这是79已设规则，不是所有避难所普遍“杀谁归谁”。 大角鹿神传说有研究者与克隆体记忆来源，沙海之灵也出实验仍仅楚光猜测。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P012211—P012745、V08·P013119—P013190","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0111","type":"EVENT","name":"十二黑箱、核燃料约束与猎手图纸","aliases":["V08"],"summary":"十二黑箱中明确识别河马2便携堆、低温灭火器、冠军咖啡豆、冠军注射剂、可变温蓝外套、小行星合成肉罐头、趣奇饼干七种，其余生活用品未逐项命名。 黑箱图示与傻瓜操作针对文化文字可能失传的极端情况；最大为可拆式车间，最小手提箱。 图纸制作样机或丐版量产当时仍待实施。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P012719—P012865、V08·P013157—P013190","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0112","type":"EVENT","name":"狼骑兵首战与电子战诱饵","aliases":["V08"],"summary":"陆军先拨百套神经连接装备，令边缘研发异种与轻步兵协同。 401技术与获救研究人员已能有限逆向生产火炬心灵干涉装置，117黑箱供配套神经连接设备；妮蔻已证技术驯化可行，不是普通抚养即可消野性。 坐骑胃口大、培养成本与死亡损失仍限制。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P012498—P012607、V08·P013192—P013467","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"EVENT-0113","type":"EVENT","name":"卷末军团准备转场，联盟决定阻止其合流","aliases":["V08"],"summary":"格里芬全息通报军团正式介入猎鹰与沙漠诸王战争，企业援军已经突袭，命钢铁之心赴九号沙漠支援。 麦克伦才知自己没有拦住企业；随后又受穿山甲话术误导，将瑞谷对手猜巨石城，仍未识别联盟。 V09及以后事件未读入本记录。","limits":"完整经过及条件见分卷事实，材料止于第八卷。","source":"V08·P013355—P013569","href":"../01_分卷事实/V08_分卷事实.md"},{"id":"GROUPV2-0001","type":"GROUP_V2","name":"拾荒者","aliases":["GROUP-0001"],"summary":"草帽、缝补破布与携物袋；贫困、战时样本衣衫褴褛。 【原文明确比较】草帽与缝缝补补的破布构成一种常见外装。原文用这种组合说明伪装者与废土上随处可见的拾荒者装束无异。 【群体描写】希望镇夜间外出的拾荒人衣衫褴褛，提着干瘪的手提袋；神情麻木是这一战时贫困群体当时的状态。","limits":"破布下藏外骨骼属于伪装士兵的配置，不能记成普通拾荒者标配。草帽并非所有季节与地区唯一头饰；不把战时神情固定为性格。 外观缺项：统一肤色、发色、发式、体型和固定鞋履均未明确。","source":"V08·P009252—P009256；V07·P007702—P007706","href":"../03_实体档案/人群v2/GROUPV2-0001_拾荒者.md","images":{"model":"人群v2图片/GROUPV2-0001_model.png","icon":"人群v2图片/GROUPV2-0001_icon.png"}},{"id":"GROUPV2-0002","type":"GROUP_V2","name":"猎户","aliases":["GROUP-0001"],"summary":"猎弓、猎物等比服装更有依据；没有已确认的统一猎装。 【职业成员样本】外出背负猎弓，是已见到的狩猎工具携带方式。 【小群体场景】两名共同狩猎者背着猎物到聚居地交易；可保留背负猎物这一劳动场景。 【职业相关样本】猎人帽在能派出猎人队伍的社区代表身上出现，可记录这种头饰样式；帽子形制、材质并未展开。","limits":"这些材料支持工具与活动外观，尚不足以把猎人帽、魁梧体型或兽皮衣定为全体猎户共性。样本不另建个人档案。 外观缺项：群体统一衣料、配色、鞋靴、面部特征和体型未明确。","source":"V04·P006351—P006354；V02·P005060—P005068；V05·P004586—P004587","href":"../03_实体档案/人群v2/GROUPV2-0002_猎户.md","images":{"model":"人群v2图片/GROUPV2-0002_model.png","icon":"人群v2图片/GROUPV2-0002_icon.png"}},{"id":"GROUPV2-0003","type":"GROUP_V2","name":"游牧民","aliases":["GROUP-0002","GROUP-0003"],"summary":"初到聚居地的群体衣衫褴褛，携狩猎弓弩；定居后的衣饰可变化。 【群体描写】初来安置的铁斧人群衣衫褴褛；交出猎枪后，狩猎用弓箭与十字弩获准保留。 【定居后成员样本】定居后的铁斧部落店员穿灵活合身的皮革外套，斜跨侧身的腰带可装弹夹与配枪；这是当地商店提供的新式成衣，不是部族传统统一服饰。 【衣饰生产资料】铁斧纺纱与摊位出现配饰、手套、围巾、袜子；只证实其制作与销售，不证明每人都穿戴同一套。","limits":"小麦色皮肤仅在少量铁斧成员之间被比较，不能扩大为全部游牧民共有肤色。不同部族与迁徙、定居阶段分开记录。 外观缺项：各部族统一发式、纹样、常服色与传统饰物未明确。","source":"V03·P004987—P004993；V07·P003910—P003915；V05·P010908—P010913","href":"../03_实体档案/人群v2/GROUPV2-0003_游牧民.md","images":{"model":"人群v2图片/GROUPV2-0003_model.png","icon":"人群v2图片/GROUPV2-0003_icon.png"}},{"id":"GROUPV2-0004","type":"GROUP_V2","name":"农奴","aliases":["GROUP-0004"],"summary":"布朗农庄可见戴脚铐拉粮车的劳动样本；体态瘦弱亦有记录。 【农庄劳动样本】农奴戴脚铐拉木质拖车，在持枪者监视下搬运粮食麻袋与工具。脚铐与负重劳动是这次场景可见的身份线索。 【职业成员样本】另一处出门场景明确描述被牵引的农奴体态瘦弱。","limits":"脚铐和瘦弱均是农奴处境的有据样本，不能断言所有农奴始终戴铐、全部瘦弱。获释后的服装与身体变化另按时期记录。 外观缺项：统一衣料、衣色、鞋履、发式、肤色与劳动伤痕未明确。","source":"V02·P000073—P000075；V02·P004850—P004851","href":"../03_实体档案/人群v2/GROUPV2-0004_农奴.md","images":{"model":"人群v2图片/GROUPV2-0004_model.png","icon":"人群v2图片/GROUPV2-0004_icon.png"}},{"id":"GROUPV2-0005","type":"GROUP_V2","name":"联盟工人","aliases":["GROUP-0005"],"summary":"工地配给棉质工作服、胶底短靴；雨季旧鞋与足部浸泡痕迹有直接描写。 【工地配给】运抵黎明城工地的物资包含一千件棉质工作服、一千双胶底短靴，明确回应工地对工作服和防水鞋的需求。这里只能确认该批供应，不表示联盟所有工人已经统一换装。 【群体描写】供应不足时，一些工人穿草鞋、木鞋或树皮扎成的鞋；雨后拎铁桶排水，不少人的脚被泡烂。属于这一工地雨季的劳动痕迹。","limits":"建筑工人的配给不自动推广至所有车间工人。未把焊工面罩、安全帽、油污围裙等常识装备补进原文。 外观缺项：工作服颜色、剪裁、标志及不同工种的统一服装未明确。","source":"V08·P004877—P004883；V08·P004883—P004887","href":"../03_实体档案/人群v2/GROUPV2-0005_联盟工人.md","images":{"model":"人群v2图片/GROUPV2-0005_model.png","icon":"人群v2图片/GROUPV2-0005_icon.png"}},{"id":"GROUPV2-0006","type":"GROUP_V2","name":"联盟警卫","aliases":["GROUP-0006"],"summary":"早期驯鹿毛皮大衣、步枪与臂戴VM；后有黑色大衣／军装、钢盔和工兵铲。 【群体描写】早期成列警卫穿变异驯鹿毛皮大衣，背笨重步枪及打包行李，胳膊戴VM；服装勉强统一，队列纪律明显。 【群体描写】后期警卫的黑色大衣配仲裁者步枪，并新配发钢盔和工兵铲。 【群体描写】贸易站维持秩序的五名警卫穿黑色军装，手持棍棒，体现执勤装束与用途。","limits":"早期毛皮大衣与后期黑军装是阶段差异。近卫精锐外骨骼不是普通街面警卫人人配发；黑衣也不是联盟独有身份凭证。 外观缺项：警徽具体图案、黑军装完整剪裁、统一身体与面部特征未明确。","source":"V04·P004603—P004608；V06·P007588—P007591；V06·P011314—P011315","href":"../03_实体档案/人群v2/GROUPV2-0006_联盟警卫.md","images":{"model":"人群v2图片/GROUPV2-0006_model.png","icon":"人群v2图片/GROUPV2-0006_icon.png"}},{"id":"GROUPV2-0007","type":"GROUP_V2","name":"联盟士兵","aliases":["GROUP-0007","GROUP-0006"],"summary":"死亡兵团灰大衣、钢盔、防毒面具；精锐作战队伍另有轻骑兵等外骨骼。 【兵团场景】死亡兵团返抵贸易站时穿灰大衣、戴钢盔与防毒面具，背自动步枪，腰挂工兵铲和刺刀。铲与刺刀上的血迹仅属这次归队场景。 【精锐分支】二十名近卫兵团士兵以轻骑兵外骨骼出动，是常备部队中的精锐装备分支。 【精锐分支】风暴兵团二十余名精锐穿五式轻骑兵外骨骼，显示不同兵团亦可采用同类装备。","limits":"灰大衣对应已出现的死亡兵团场景，不能作为全军唯一制服；外骨骼覆盖和型号随队伍不同，不写人人动力装甲。 外观缺项：全军统一徽章、各军种常服、统一体貌未明确。","source":"V06·P011319—P011329；V07·P002068—P002071；V08·P008437—P008440","href":"../03_实体档案/人群v2/GROUPV2-0007_联盟士兵.md","images":{"model":"人群v2图片/GROUPV2-0007_model.png","icon":"人群v2图片/GROUPV2-0007_icon.png"}},{"id":"GROUPV2-0008","type":"GROUP_V2","name":"红河镇矿工","aliases":["GROUP-0010"],"summary":"已明确危险填埋矿劳动与受押送来源；现场工作服及统一体貌尚缺直接描写。 【待送矿人员场景】准备送往红河矿洞的俘虏二十多人被一条绳子串成长列，并由持枪人员押送。只记录矿场劳动力来源中的这一押送场景，不当成井下作业常态。 【背景依据，非外观证据】原文描述红河矿山多为垃圾填埋场旧址，奴工在其中长期作业且寿命短；这是劳动处境依据，没有提供矿工的明确衣帽、肤色或体型。","limits":"不能凭矿工身份补矿灯、安全帽、煤黑皮肤、镐头或统一囚服。矿工I型是装备型号，现有材料不支持红河镇矿工普遍穿用。 外观缺项：井下作业服、鞋靴、护具、工具携带、外露粉尘／伤痕及群体体貌均待有直接材料后补。","source":"V03·P002771—P002782；V03·P002772—P002774","href":"../03_实体档案/人群v2/GROUPV2-0008_红河镇矿工.md","images":{"model":"人群v2图片/GROUPV2-0008_model.png","icon":"人群v2图片/GROUPV2-0008_icon.png"}},{"id":"GROUPV2-0009","type":"GROUP_V2","name":"行商","aliases":["GROUP-0011"],"summary":"冬行商队有棉大衣、胸挂步枪；货运队伍和季节性衣装比统一体貌更有辨识意义。 【商队从业者样本】冬季抵达的商队风尘仆仆，其雇员穿棉质大衣，胸前挂半自动步枪。是特定商队的防寒、武装旅行样式。 【富裕分支】巨石城繁华街段可见衣着华贵的商人，与贫困废土客形成明显差别；该描写只属于富裕城市商人场景。","limits":"行商财力与路线差异大，不设通用华服、外骨骼或统一面容。商队雇员携枪不代表全部贸易人员都是战斗人员。 外观缺项：通行商人徽记、固定帽饰、统一衣色与身体特征未明确。","source":"V03·P003759—P003764；V08·P002109—P002114","href":"../03_实体档案/人群v2/GROUPV2-0009_行商.md","images":{"model":"人群v2图片/GROUPV2-0009_model.png","icon":"人群v2图片/GROUPV2-0009_icon.png"}},{"id":"GROUPV2-0010","type":"GROUP_V2","name":"佣兵","aliases":["GROUP-0011"],"summary":"多数巨石城佣兵用铁丝骨架加钢板护要害；富裕者使用全装防弹甲、外骨骼或昂贵义体。 【群体描写】巨石城佣兵绝大多数用铁丝龙骨加钢板保护要害；少数有钱者才买得起外骨骼和全装防弹甲。 【装备改装样式】存在给轻型KV-1外骨骼加装钢板的佣兵改装法；这是见过的配置，不是人人采用。 【富裕分支】繁华街段出现装着昂贵仿生学义体的佣兵；属于高消费分支，不能覆盖低装备佣兵。","limits":"不把个体的断肢、电子眼、发色、性别、强壮体格或胡须推广为佣兵共性。义体有成本门槛，也不总能从外表识别。 外观缺项：跨商队统一制服、徽章与固定兵器型号未明确。","source":"V02·P004589—P004593；V02·P004131—P004135；V08·P002109—P002114","href":"../03_实体档案/人群v2/GROUPV2-0010_佣兵.md","images":{"model":"人群v2图片/GROUPV2-0010_model.png","icon":"人群v2图片/GROUPV2-0010_icon.png"}},{"id":"GROUPV2-0011","type":"GROUP_V2","name":"巨石城贵族","aliases":["GROUP-0013"],"summary":"追求高档、干净的仿生学义体与延缓衰老；明确服装细节仍有限。 【场景描写】繁华街道人群包含内城贵族，原文强调其与寻常人不同的气质；同句“衣着华贵”直接修饰商人，不能偷换成全体贵族的特定服装。 【群体审美】内城贵族偏好干净卫生的仿生学义体，连带机油味的机器代用品也看不上。记录的是身体改造的材质与审美取向，不意味着一眼可见机械结构。 【部分群体】后续明确不少内城贵族用上东海岸高级义体；只支持部分人群实际采用，不支持人人改造。","limits":"延寿与义体消费不等于所有人都年轻、完美或外露金属。未据贵族身份补燕尾服、礼裙、珠宝、统一肤色或肥胖体型。 外观缺项：可推广的礼服款式、颜色、家徽、首饰、发式与相貌未明确。","source":"V08·P002109—P002114；V08·P006254—P006258；V08·P013519—P013522","href":"../03_实体档案/人群v2/GROUPV2-0011_巨石城贵族.md","images":{"model":"人群v2图片/GROUPV2-0011_model.png","icon":"人群v2图片/GROUPV2-0011_icon.png"}},{"id":"GROUPV2-0012","type":"GROUP_V2","name":"企业士兵","aliases":["GROUP-0014"],"summary":"厚重全防护动力装甲与轻便机械外骨骼并存，分别搭配高斯步枪、突击步枪或轻机枪。 【装甲分支】动力装甲分队厚重装甲覆盖每一寸皮肤，手持长方形模块化步枪；外形如人形坦克，但仍能在丛林灵活穿行。 【混合编成】一支陆战小队同时包含动力装甲与轻便机械外骨骼。动力装甲队员持高斯步枪，另两人分别持小型突击步枪、轻机枪。 【长途任务】这次长途任务中，队员背大而重的背包，并有机械狗驮补给；属于行军负载，不是身体结构。","limits":"不能将动力装甲铺给所有企业士兵；护甲颜色、型号与负载需随出现的分队分别注明，不以一个指挥官装备代替全军。 外观缺项：各部队常服统一配色、共同体貌与裸露皮肤特征未明确。","source":"V04·P002259—P002265；V04·P003998—P004001；V04·P003998—P004002","href":"../03_实体档案/人群v2/GROUPV2-0012_企业士兵.md","images":{"model":"人群v2图片/GROUPV2-0012_model.png","icon":"人群v2图片/GROUPV2-0012_icon.png"}},{"id":"GROUPV2-0013","type":"GROUP_V2","name":"企业事务官","aliases":["GROUP-0014"],"summary":"开拓者随行非战斗工作人员常见统一灰色大衣，外观区别于重装突击队。 【衣装明确，文职身份为场内推测】企业来车的后排两人没有穿外骨骼，只穿统一灰色大衣；原文将其判断为“大概是文职人员”，职务判断保留推测性质。 【工作人员场景】开拓者工作人员穿灰色大衣进行设备接线、操作触屏，证明这种外衣也用于现场工作。 【随行人员群体】二十余名乘员穿灰大衣排队就餐，支持灰大衣是该批企业随行人员的共同装束。","limits":"灰大衣并非已证实的事务官专属官服；司机、技术人员、文职须按实际工作区分。101营地的“生产事务官、教育事务官”不能移植给企业。 外观缺项：企业行政人员正式服制、职级标记、全体配装及统一体貌未明确。","source":"V04·P002984—P002986；V04·P003339—P003343；V04·P003890—P003894","href":"../03_实体档案/人群v2/GROUPV2-0013_企业事务官.md","images":{"model":"人群v2图片/GROUPV2-0013_model.png","icon":"人群v2图片/GROUPV2-0013_icon.png"}},{"id":"GROUPV2-0014","type":"GROUP_V2","name":"军团克隆人士兵","aliases":["GROUP-0015"],"summary":"破毛皮大衣、毛边短靴、颈部电击项圈，样式统一的简陋栓动铁管步枪。 【群体描写】成队克隆兵没有护具、没有统一服装，靠破烂毛皮大衣和缀毛边短靴勉强遮体。 【群体描写】颈部电击项圈是其统一装备；跟在后面的下级军官手持遥控器，是可见的控制关系。 【群体描写】手持统一样式栓动铁管步枪，木制枪托廉价，铸造枪管笨重。","limits":"原文对眼神的贬抑比喻不转换成非人类生理结构。没有明确证据支持这批士兵全长同一张脸；也不把普通克隆人的描述迁移至军团廉价兵。 外观缺项：一致脸型、身高、发色、肤色及全军统一生物外形未明确。","source":"V04·P004810—P004812；V04·P004812—P004818；V04·P004810—P004811","href":"../03_实体档案/人群v2/GROUPV2-0014_军团克隆人士兵.md","images":{"model":"人群v2图片/GROUPV2-0014_model.png","icon":"人群v2图片/GROUPV2-0014_icon.png"}},{"id":"GROUPV2-0015","type":"GROUP_V2","name":"军团扈从军士兵","aliases":["GROUP-0017"],"summary":"初征队伍衣装杂乱、面有菜色、身材瘦削、装备简陋；后有两套亚麻军服配给。 【群体描写】瑞谷初征部队衣装五花八门、队列歪斜；脸带营养不良的菜色，身板瘦如麻杆。适用于这批本地征募者的群体描写。 【群体描写】每人只领一把开膛者步枪，上战场给十五或三十发备弹，装备层次显著低于带队黑袍正规兵。 【后期配给】后文明确扈从军会配两套亚麻布军服，供操练和巡逻换洗。保留这一配给阶段，不抹去早期杂服场景。","limits":"不能把营养不良推广至军团所有军人，也不能给来自不同地区的本地扈从统一安上军团公民鼻形或黑袍。 外观缺项：亚麻军服颜色、剪裁、徽章、统一头盔与护甲未明确。","source":"V08·P010520—P010525；V08·P010520—P010524；V08·P012540—P012542","href":"../03_实体档案/人群v2/GROUPV2-0015_军团扈从军士兵.md","images":{"model":"人群v2图片/GROUPV2-0015_model.png","icon":"人群v2图片/GROUPV2-0015_icon.png"}},{"id":"GROUPV2-0016","type":"GROUP_V2","name":"军团士兵（航空陆战队）","aliases":["GROUP-0016"],"summary":"标志性黑袍／黑斗篷、重型防弹甲、结构紧凑的突击步枪，整齐且训练有素。 【群体描写】列队降至地面的士兵身披黑色斗篷，眼神锐利、队形整齐；黑袍配结构紧凑的勇士突击步枪被直接写作身份标志。 【群体描写】营地执勤与巡逻者同为披黑袍、穿重型防弹甲的士兵，支持黑袍与重甲的组合。 【体貌识别场景】在识别一批军团黑斗篷人员的尸体时，原文指出鼻梁中间隆起是军团人员的识别线索。仅保留该场景与其对应族群线索，不能据此覆盖本地扈从与所有克隆兵。","limits":"黑色外骨骼明确出现在指挥人员身上，不等于每名陆战兵均穿。鼻梁起源的古代DNA或基因修改只是书内不同说法。 外观缺项：军服内层完整款式、各兵种外骨骼普及率和一致肤色发色未明确。","source":"V08·P007814—P007818；V08·P012388—P012395；V08·P007293—P007302","href":"../03_实体档案/人群v2/GROUPV2-0016_军团士兵（航空陆战队）.md","images":{"model":"人群v2图片/GROUPV2-0016_model.png","icon":"人群v2图片/GROUPV2-0016_icon.png"}},{"id":"GROUPV2-0017","type":"GROUP_V2","name":"军团军官","aliases":["GROUP-0016"],"summary":"军衔肩章上的星是明确等级标志；笔挺制服、大衣和黑色外骨骼均有不同岗位样式。 【军衔标记】肩章星数用于区分指挥层级，万夫长高半级的差别体现为多一颗星。 【军官衣装样本】参谋部来员穿笔挺制服，是已见军官衣装样式；不能由这个样本确定全体制服的颜色和剪裁。 【前线军官样式】前线指挥者穿黑色外骨骼，属于岗位装备样式。 【带克隆兵的军官分支】督促克隆兵行进的下级军官手持遥控器，对应士兵颈上的电击项圈。 【指挥人员衣装样本】另见指挥人员穿藏蓝色大衣，与前线外骨骼样式并列记录，不认定所有军官一律穿藏蓝大衣。","limits":"不把某位将领的魁梧、面部棱角、贵重服饰写成所有军官共性；不把扈从升任的军官与军团公民一律视为同一族群。 外观缺项：各级完整军衔图案、跨部队统一常服色、帽式及统一体貌未明确。","source":"V08·P007492—P007496；V08·P008600—P008604；V08·P007821—P007823；V04·P004812—P004818；V04·P004821—P004823","href":"../03_实体档案/人群v2/GROUPV2-0017_军团军官.md","images":{"model":"人群v2图片/GROUPV2-0017_model.png","icon":"人群v2图片/GROUPV2-0017_icon.png"}},{"id":"GROUPV2-0018","type":"GROUP_V2","name":"学院研究员/勘探员","aliases":["学院研究院/勘探员","GROUP-0018"],"summary":"精密植入义体与工具化义肢是已有技术线索；统一袍服、白大褂或体貌没有足够依据。 【外勤技术人员样本】已出现的勘探人员使用仿生义臂，手臂能展开细如发丝的银线，作为神经元微创手术工具；这是外露工具形态的样本。 【识别装备样本】仿生义臂在追踪学院叛逃勘探员时被当作辨认线索，说明这是可见个体装备，不证明学院人人如此改造。 【分类依据，非外观证据】原文区分外勤勘探员回收遗迹数据、研究员在学院分析修复；该分工用于限制外观样本的适用范围，不代替衣装描写。","limits":"银线工具只能写为已见义体样式，不能绘成全员机械手。其他避难所的研究员也不自动属于学院；黑箱徽记不等于制服纹章。 外观缺项：学院研究员／勘探员统一制服、颜色、徽章、常规护具与群体体貌未明确。","source":"V08·P010768—P010772；V04·P008653—P008658；V04·P008738—P008742","href":"../03_实体档案/人群v2/GROUPV2-0018_学院研究员与勘探员.md","images":{"model":"人群v2图片/GROUPV2-0018_model.png","icon":"人群v2图片/GROUPV2-0018_icon.png"}},{"id":"GROUPV2-0019","type":"GROUP_V2","name":"避难所居民","aliases":["GROUP-0019","GROUP-0020","GROUP-0021"],"summary":"蓝外套是强识别线索；已有群体常被描述为清秀干净，不能固定所有避难所居民的体貌。 【衣装识别】地表居民会根据蓝色外套将来人当作避难所居民，说明蓝外套具有社会识别性。 【衣料描写】衣料触感类似橡胶，却轻盈柔软如化纤；原文明确它采用自适应导热材料。 【群体外观比较】与早期警卫相比，避难所蓝外套群体被描述为大多清秀干净，外形近似企业中层以上员工；这是场内观察的概括，非绝对生理标准。","limits":"蓝外套可被转赠或伪装，不能仅凭衣装证明身份；不同避难所、离所后职业与装备变化分别保留，不将任何特殊实验体当全体外形。 外观缺项：所有避难所统一剪裁、共同肤色发色、身高及固定面容未明确。","source":"V01·P000558—P000561；V02·P004024—P004026；V04·P004604—P004608","href":"../03_实体档案/人群v2/GROUPV2-0019_避难所居民.md","images":{"model":"人群v2图片/GROUPV2-0019_model.png","icon":"人群v2图片/GROUPV2-0019_icon.png"}},{"id":"GROUPV2-0020","type":"GROUP_V2","name":"落霞行省雄狮王国居民","aliases":["GROUP-0023"],"summary":"使团群体裹长袍、戴防沙头巾，牵变异骆驼；适用于该群体的旅行场景。 【使团群体旅行装】约二十名来客全员裹长袍、戴防沙头巾，牵着变异骆驼抵达；随后说明自己是雄狮王国使者。 【适用人群依据】其中包含护卫，接待时被安顿在警卫队驻地附近；因此保留使团及护卫共同旅行外装的范围。","limits":"不把某名护卫的络腮胡作为全体男子共性。长袍与头巾没有明确颜色、纹样和材质，也不足以证明全部平民或王室常服如此。 外观缺项：国内平民日常装、王国军服、共同肤色发色、饰物及民族体貌未明确。","source":"V08·P012866—P012871；V08·P012883—P012887","href":"../03_实体档案/人群v2/GROUPV2-0020_落霞行省雄狮王国居民.md","images":{"model":"人群v2图片/GROUPV2-0020_model.png","icon":"人群v2图片/GROUPV2-0020_icon.png"}},{"id":"GROUPV2-0021","type":"GROUP_V2","name":"普通掠夺者","aliases":["掠夺者","GROUP-0024"],"summary":"破袄、皮衣等杂式衣装与简陋武装；自制铁管步枪、拾得枪械及冷兵器并存，不指定统一氏族标志。 【地区装备概括】郊区掠夺者常用自制铁管步枪或捡来的武器，部分直接使用冷兵器；武器来源混杂，不是统一制式。 【通用衣装样式，来源于血手缴获物】破袄、皮衣是已出现的掠夺者衣装样式：从血手成员取得的旧衣被交给获救幸存者穿用。这里只保留可用于普通形象的衣装种类，不证明它是所有非氏族掠夺者的统一服装；该句的瘦弱体貌属于获救者。 【行旅见闻】企业远行队谈及沿途常见的持铁管步枪掠夺者，作为普通低装备匪帮武装层次的另一条依据；这是队员的见闻。","limits":"本类不自动附加红色血手印或嚼骨式骨牙配件；也不能把贫困、衣物破旧本身当成掠夺者身份证明。普通表示本次外观分类粒度，不表示人人无组织、人人不穿护甲。 外观缺项：未明确统一衣色、帽式、护甲、身高、肤色、发色和身体纹样。","source":"V02·P000714—P000718；V03·P004153—P004157；V08·P005078—P005080","href":"../03_实体档案/人群v2/GROUPV2-0021_普通掠夺者.md","images":{"model":"人群v2图片/GROUPV2-0021_model.png","icon":"人群v2图片/GROUPV2-0021_icon.png"}},{"id":"GROUPV2-0022","type":"GROUP_V2","name":"血手氏族掠夺者","aliases":["血手氏族成员","血手掠夺者","红色血手印","GROUP-0024"],"summary":"红色血手印作为群体辨识重点；氏族有血手印旗帜、信物，成员常见指骨手镯、项链、挂件等骨饰。 【旗帜线索为人物转述；红色由用户补充】本轮按用户补充将红色血手印列为此类的主要视觉标识。原文中，猎户转述北方掠夺人群用血手印作旗帜，随后指向血手氏族；原文未在该处规定标记涂于人体或衣服的哪个部位。 【氏族图腾】氏族保存的日记封面印有血手印，并被当作精神图腾；另有带血手印的往来信封。支持将手印作为可携带物和群体标识，不等于全员佩戴相同徽章。 【血手氏族分支】血手氏族大多数掠夺者热衷指骨装饰，可制成手镯、项链、挂件乃至装饰性骨甲；颅骨器皿则是首领专用，不属于普通成员通用佩饰。 【氏族衣装来源】血手成员的缴获衣物中包含破袄、皮衣；这些是该氏族已有衣装依据，不能把换上它们的获救者之瘦弱体态写给氏族成员。","limits":"红色血手印按用户最新要求突出；其绘制部位、尺寸、底色与人体涂绘方式未明确，不擅自添加。骨饰也见于其他掠夺人群，血手类别的区别不能只靠是否带骨头。首领使用颅骨器皿与普通成员配饰分开。 外观缺项：统一军服、固定配色组合、标记具体佩戴／绘制位置，以及一致体貌未明确。","source":"V03·P005850—P005855；用户本轮形象补充：红色血手印；V03·P003033—P003038；V02·P004774—P004779；V03·P004153—P004157","href":"../03_实体档案/人群v2/GROUPV2-0022_血手氏族掠夺者.md","images":{"model":"人群v2图片/GROUPV2-0022_model.png","icon":"人群v2图片/GROUPV2-0022_icon.png"}},{"id":"GROUPV2-0023","type":"GROUP_V2","name":"嚼骨部落掠夺者","aliases":["嚼骨部落成员","嚼骨掠夺者","骨头配件","GROUP-0024"],"summary":"毛皮、鬣狗皮外套与人骨、兽牙配件形成主要轮廓；部分队伍使用带刺刀的开膛者步枪和其他军团制式武器。 【具体队伍共性】冬柳袭击队约二十名掠夺者穿鬣狗皮外套，颈挂人骨与兽牙配件，手持带刺刀的开膛者步枪；以此作为本类骨饰与皮衣组合的直接群体依据，不把所有部众强制画成同一套。 【群体描写】年夜长久农庄交战后，掠夺者尸体的外装为毛皮，与警卫黑大衣相区别；补充该部作战人员的毛皮外装轮廓。 【部队装备清单】第六卷从这支掠夺队伍缴获的主要枪械为军团制式开膛者步枪、Pu-9冲锋枪、刀片突击步枪，另有少量铁管步枪和手枪。说明规模化队伍可有较整齐、火力更强的军备，不应一律绘成持破枪的散匪。 【组织内参谋分支】嚼骨部落内存在穿藏蓝色大衣、地位较高的参谋群体；其衣装与普通掠夺队员的毛皮外装分开记录，不当成全体制服。","limits":"骨头与兽牙配件应突出，但骨饰不是嚼骨独占；不将血手红手印移作本类标志。不同氏族、步兵与参谋的装备层次分别记录，藏蓝大衣不是普通部众通用制服。 外观缺项：骨饰的统一排列、固定数量、全体通用胸甲／头盔、统一肤色与体型未明确。","source":"V05·P005932—P005938；V05·P010687—P010690；V06·P000934—P000936；V05·P005963—P005969","href":"../03_实体档案/人群v2/GROUPV2-0023_嚼骨部落掠夺者.md","images":{"model":"人群v2图片/GROUPV2-0023_model.png","icon":"人群v2图片/GROUPV2-0023_icon.png"}}];const labels={ALL:'全部',GROUP_V2:'人群',LOC:'地点',BLD:'建筑',BIO:'生物',ITM:'物品材料',ORG:'组织',EVENT:'事件'};let selected='ITM';const query=document.getElementById('query'),filters=document.getElementById('filters'),results=document.getElementById('results'),count=document.getElementById('count');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(const [key,label]of Object.entries(labels)){const button=document.createElement('button');button.textContent=label+' '+(key==='ALL'?entries.length:entries.filter(e=>e.type===key).length);button.dataset.key=key;button.onclick=()=>{selected=key;render()};filters.append(button)}function bioImages(e){
if(!["BIO","GROUP_V2","ITM"].includes(e.type))return "";
const items=e.id==="ITM-0049"?[["icon","抗辐剂 · 图鉴图标"],["model","抗辐剂 · 建模参考图"],["decon_icon","消辐剂 · 图鉴图标"],["decon_model","消辐剂 · 建模参考图"]]:[["icon","图鉴图标"],["model","建模参考图"]];
const note=e.imageNote?'<p class="image-note">制图代表：'+esc(e.imageNote)+'</p>':"";
return note+'<div class="bio-images">'+items.map(([key,label])=>e.images&&e.images[key]?'<figure><a href="'+encodeURI(e.images[key])+'" target="_blank" rel="noopener"><img loading="lazy" src="'+encodeURI(e.images[key])+'" alt="'+esc(e.name+" · "+label)+'"></a><figcaption>'+label+'</figcaption></figure>':'<div class="bio-pending">'+label+'：待生成</div>').join("")+'</div>';
}function render(){results.classList.toggle('biology-view',(['BIO','GROUP_V2','ITM'].includes(selected)));const terms=query.value.toLocaleLowerCase().trim().split(" ").filter(Boolean);const found=entries.filter(e=>(selected==='ALL'||e.type===selected)&&terms.every(t=>[e.id,e.name,e.aliases.join(' '),e.summary,e.limits,e.source].join(' ').toLocaleLowerCase().includes(t)));for(const b of filters.children){b.classList.toggle('active',b.dataset.key===selected);b.setAttribute('aria-pressed',String(b.dataset.key===selected))}count.textContent='找到 '+found.length+' 条资料';results.innerHTML=found.map(e=>'<article class="card"><div class="meta">'+esc(e.id)+' · '+esc(labels[e.type])+'</div><h2><a href="'+encodeURI(e.href)+'">'+esc(e.name)+'</a></h2>'+bioImages(e)+(e.aliases.length?'<p class="sub">别称 / 型号：'+esc(e.aliases.join('、'))+'</p>':'')+'<p>'+esc(e.summary)+'</p><p class="limit">'+esc(e.limits)+'</p><p class="source">'+esc(e.source)+'</p></article>').join('');if(!found.length)results.textContent='没有匹配条目，可缩短词语或切换类型。'}query.addEventListener('input',render);render();</script></body></html>
